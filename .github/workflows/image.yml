name: Image

# 只做一件事：每次 master 有新提交（也就是有分支合并进来）时，
# 从头编译一次前端，并用仓库源码构建出 backend 镜像，验证镜像能构建成功。
# 不推送镜像仓库，也不需要任何额外的 secret。
#
# 为什么单独一个 workflow：build.yml 是上游 Hydro 的 CI（lint + test + 发布上游 npm 包），
# 跟镜像构建的触发条件和耗时完全不同，混在一起会让两边互相拖慢。

on:
  push:
    branches: [master]
  # 手动作业：需要在合并前试构建某个分支时用
  workflow_dispatch:

# 同一个分支有新的推送时，取消还在跑的旧构建，省 Actions 额度
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # Corepack 首次下载 yarn 时会交互式询问，CI 里必须关掉
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  IMAGE_NAME: hgnuoj-backend

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Check out
      uses: actions/checkout@v4
      with:
        # packages/hydrojudge/vendor/testlib 是 submodule，构建时会用到
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        # 上下文必须是仓库根目录：Dockerfile 里 COPY 整个工作区
        context: .
        file: install/docker/source/Dockerfile
        # 只构建当前 runner 的架构（amd64），不推送
        platforms: linux/amd64
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        # Dockerfile 里的 yarn 缓存用 cache mount，默认只活在单次构建内；
        # type=gha 把构建层和 cache mount 一起存进 Actions 缓存，下次运行可直接复用，
        # 不用每次重新下载依赖、重编译 webpack。
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 构建成功不代表镜像能跑起来，这里做一次冒烟检查：
    # 1. 前端产物确实在镜像里
    # 2. 后端入口能从镜像内的源码正常加载（不需要数据库）
    - name: Smoke test image
      run: |
        set -euo pipefail
        IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

        echo '::group::前端构建产物'
        docker run --rm --entrypoint sh "$IMAGE" -c '
          ls packages/ui-default/public | head -20
          test -f packages/ui-default/public/manifest.json
          test -n "$(find packages/ui-default/public -maxdepth 1 -name "*.js" -print -quit)"
        '
        echo '::endgroup::'

        echo '::group::后端模块加载'
        # 注意不能直接 require('hydrooj')：plugin-api 里的模块会写 global.Hydro，
        # 只有走 bin/hydrooj.js 才会初始化。所以这里用 bin 入口跑一个不需要数据库的子命令，
        # 它能覆盖 @hydrooj/register 的 TS 加载、依赖解析和 workspace 软链接。
        docker run --rm --entrypoint sh "$IMAGE" -c '
          node packages/hydrooj/bin/hydrooj.js addon list
        '
        echo '::endgroup::'

    - name: Image size
      run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' "${{ env.IMAGE_NAME }}"
